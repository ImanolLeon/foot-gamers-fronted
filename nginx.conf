server {
    listen 80;

    # Directorio donde Nginx guardará y leerá los archivos estáticos compilados por Vite
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Configuración esencial para React Router (SPA)
    # Si recargas una sub-ruta como /perfil o /dashboard, Nginx redirige siempre a index.html 
    # para que React Router se encargue de mostrar la pantalla correcta en lugar de dar un error 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy inverso para redirigir las peticiones que empiecen con /api hacia tu backend en Dokploy.
    # REEMPLAZA "footgamers-backend-hjp0rd" por el nombre exacto del contenedor/servicio de tu backend en Dokploy.
    location /api/ {
        proxy_pass http://footgamers-backend-hjp0rd:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}